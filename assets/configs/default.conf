		upload_store assets/www/game/siege/smoke;
		allowed_methods GET POST DELETE;
		autoindex on;
		cgi {
			.py = /usr/bin/python3;
		}
	}
}

# Directory listings and custom indexes.
server {
	listen 8091;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/game/siege/autoindex;
	#error_pages error-pages;

	location / {
		allowed_methods GET;
		autoindex on;
	}

	location /custom_index/ {
		root assets/www/game/siege/autoindex/custom_index;
		allowed_methods GET;
		index landing.htm;
		autoindex on;
	}
}

# Upload, read, and delete fixtures. Other paths allow GET only.
