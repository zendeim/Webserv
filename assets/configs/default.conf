# Location roots, longest-prefix matching, indexes, and redirects.
server {
	listen 8094;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/game/siege/routes;
	error_pages error-pages;

	location / {
		allowed_methods GET;
		autoindex on;
	}

	location /alias/ {
		root assets/www/game/siege/routes/mapped;
		allowed_methods GET;
	}

	location /alias/deep/ {
		root assets/www/game/siege/routes/deep_mapping;
		allowed_methods GET;
	}

	location /landing/ {
		root assets/www/game/siege/routes/landing;
		allowed_methods GET;
		index home.htm;
	}

	location /no-list/ {
		root assets/www/game/siege/routes/no-list;
		allowed_methods GET;
		autoindex off;
	}

	location /old {
		allowed_methods GET;
		return 301 /new/;
	}

	location /temporary {
		allowed_methods GET;
		return 302 /new/;
	}

	location /jump {
		allowed_methods GET;
		return 307 /new/;
	}

}

# A 1 KiB request-body limit; seed downloads are unaffected.
server {
	listen 8095;
	host 127.0.0.1;
	client_max_body_size 1K;
	root assets/www/game/siege/limits;
	error_pages error-pages;

	location / {
		allowed_methods GET;
	}

	location /uploads/ {
		root assets/www/game/siege/limits/uploads;
		upload_store assets/www/game/siege/limits/uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
	}
}
